      port: 26379

---
# Default deny all ingress traffic (security best practice)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: location-sync-gateway
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Note: These network policies assume:
# 1. A CNI plugin that supports NetworkPolicy (Calico, Cilium, Weave Net)
# 2. Namespace labels are applied for cross-namespace communication
# 3. Monitoring namespace has label: name=monitoring
# 4. Ingress namespace has label: name=ingress-nginx
#
# Apply namespace labels:
# kubectl label namespace monitoring name=monitoring
# kubectl label namespace ingress-nginx name=ingress-nginx
# kubectl label namespace kube-system name=kube-system
