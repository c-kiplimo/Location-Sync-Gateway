apiVersion: v1
kind: Namespace
metadata:
  name: location-sync-gateway
  labels:
    name: location-sync-gateway
    environment: production
    managed-by: kubectl
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: location-sync-gateway-quota
  namespace: location-sync-gateway
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: location-sync-gateway-limits
  namespace: location-sync-gateway
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: "100m"
      memory: 128Mi
    default:
      cpu: "1"
      memory: 1Gi
    defaultRequest:
      cpu: "500m"
      memory: 512Mi
    type: Container
