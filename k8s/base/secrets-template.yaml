# ============================================================
# SECRETS TEMPLATE - Sensitive data storage
# ============================================================
#
# ⚠️ IMPORTANT SECURITY NOTES:
#   1. DO NOT commit this file with real secrets to Git!
#   2. Use this as a template only
#   3. Create actual secrets using kubectl create secret command
#   4. Enable encryption at rest in production Kubernetes
#
# PURPOSE:
#   - Stores passwords, API keys, certificates securely
#   - Base64 encoded (NOT encrypted by default)
#   - Access controlled by Kubernetes RBAC
#   - Can be rotated without redeploying pods
#
# RECOMMENDED APPROACH (Production):
#   Use kubectl command line instead of this file:
#
#   kubectl create secret generic postgres-secret \
#     --from-literal=POSTGRES_USER='lsg_prod' \
#     --from-literal=POSTGRES_PASSWORD='YOUR_STRONG_PASSWORD' \
#     --from-literal=POSTGRES_DB='location_sync_gateway' \
#     --namespace=location-sync
#
# ALTERNATIVE APPROACH (Development):
#   1. Copy this file: cp secrets-template.yaml secrets.yaml
#   2. Edit secrets.yaml with your base64 encoded values
#   3. kubectl apply -f secrets.yaml
#   4. Add secrets.yaml to .gitignore
#
# HOW TO BASE64 ENCODE:
#   echo -n 'my-secret-password' | base64
#   Output: bXktc2VjcmV0LXBhc3N3b3Jk
#
# HOW TO BASE64 DECODE:
#   echo 'bXktc2VjcmV0LXBhc3N3b3Jk' | base64 --decode
#   Output: my-secret-password
#
# HOW PODS USE SECRETS:
#   env:
#     - name: POSTGRES_PASSWORD
#       valueFrom:
#         secretKeyRef:
#           name: postgres-secret
#           key: POSTGRES_PASSWORD
#
# HOW TO VIEW SECRETS:
#   kubectl get secrets
#   kubectl describe secret postgres-secret
#   kubectl get secret postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 --decode
#
# HOW TO UPDATE:
#   kubectl delete secret postgres-secret
#   kubectl create secret generic postgres-secret --from-literal=...
#
# HOW TO ROTATE:
#   1. Create new secret version
#   2. Update pods to use new secret
#   3. Delete old secret
#
# ============================================================

---
# PostgreSQL Database Credentials
# Used by: Gateway service to connect to database
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: location-sync
  labels:
    app: location-sync-platform
type: Opaque                      # Generic secret type
data:
  # Database username
  # Decode: echo 'bHNnX3Byb2Q=' | base64 --decode
  # Result: lsg_prod
  POSTGRES_USER: bHNnX3Byb2Q=

  # Database password (CHANGE THIS!)
  # Example: echo -n 'MY_STRONG_PASSWORD_12345' | base64
  # Replace this value with your own base64 encoded password
  POSTGRES_PASSWORD: Q0hBTkdFX1RISVNfUEFTU1dPUkRfMTIzNDU=

  # Database name
  # Decode: echo 'bG9jYXRpb25fc3luY19nYXRld2F5' | base64 --decode
  # Result: location_sync_gateway
  POSTGRES_DB: bG9jYXRpb25fc3luY19nYXRld2F5

---
# Redis Cache Credentials
# Used by: Gateway service for caching
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: location-sync
type: Opaque
data:
  # Redis password (CHANGE THIS!)
  # Example: echo -n 'MY_REDIS_PASSWORD_67890' | base64
  REDIS_PASSWORD: Q0hBTkdFX1RISVNfUkVESVNfUEFTU1dPUkQ=

---
# Uberall API Credentials
# Used by: Gateway service to call Uberall API
apiVersion: v1
kind: Secret
metadata:
  name: uberall-api-secret
  namespace: location-sync
type: Opaque
data:
  # Uberall API Key (get from Uberall dashboard)
  # Example: echo -n 'sk_live_abc123xyz789' | base64
  UBERALL_API_KEY: WU9VUl9VQkVSQUxMX0FQSV9LRVlfSEVSRQ==

---
# JWT Secret Key
# Used by: Gateway service for JWT token generation/validation
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: location-sync
type: Opaque
data:
  # JWT secret key (generate random 32-byte string)
  # Example: openssl rand -base64 32 | base64
  JWT_SECRET_KEY: WU9VUl9KV1RfU0VDUkVUX0tFWV9IRVJFXzMyX0JZVEVT

---
# Grafana Admin Credentials
# Used by: Grafana for admin login
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: location-sync
type: Opaque
data:
  # Grafana admin user
  # Decode: echo 'YWRtaW4=' | base64 --decode
  # Result: admin
  GF_SECURITY_ADMIN_USER: YWRtaW4=

  # Grafana admin password (CHANGE THIS!)
  # Example: echo -n 'MY_GRAFANA_PASSWORD' | base64
  GF_SECURITY_ADMIN_PASSWORD: Q0hBTkdFX1RISVNfR1JBRkFOQV9QQVNTV09SRA==

---
# TLS Certificate Secret (for Ingress HTTPS)
# This should be created by cert-manager automatically, or manually:
#
# kubectl create secret tls tls-certificate \
#   --cert=path/to/fullchain.pem \
#   --key=path/to/privkey.pem \
#   --namespace=location-sync
#
# Or use cert-manager to automatically provision Let's Encrypt certificates:
#   - Install cert-manager
#   - Create ClusterIssuer (see monitoring/cert-manager.yaml)
#   - Ingress annotation will trigger automatic cert creation
#
# File format (manual creation):
# apiVersion: v1
# kind: Secret
# metadata:
#   name: tls-certificate
#   namespace: location-sync
# type: kubernetes.io/tls
# data:
#   tls.crt: <base64 encoded certificate>
#   tls.key: <base64 encoded private key>

---
# ============================================================
# SECURITY BEST PRACTICES
# ============================================================
#
# 1. NEVER commit secrets to Git
#    - Add secrets.yaml to .gitignore
#    - Use secrets management tools (Vault, AWS Secrets Manager)
#
# 2. Use strong, unique passwords
#    - Minimum 16 characters
#    - Mix of uppercase, lowercase, numbers, symbols
#    - Generate: openssl rand -base64 32
#
# 3. Rotate secrets regularly
#    - Database passwords: Every 90 days
#    - API keys: When compromised or annually
#    - Certificates: Before expiry
#
# 4. Enable encryption at rest
#    - Kubernetes: Enable EncryptionConfiguration
#    - Cloud: Use KMS (AWS KMS, Google Cloud KMS)
#
# 5. Limit secret access
#    - Use RBAC to control who can read secrets
#    - Use separate namespaces for dev/staging/prod
#    - Audit secret access (enable audit logging)
#
# 6. Use external secret managers (production)
#    - HashiCorp Vault
#    - AWS Secrets Manager
#    - Google Secret Manager
#    - Azure Key Vault
#    - External Secrets Operator (ESO)
#
# 7. Scan for secrets in code
#    - Use git-secrets or trufflehog
#    - Enable pre-commit hooks
#    - Use secret scanning in CI/CD
#
# ============================================================

# ============================================================
# TROUBLESHOOTING
# ============================================================
#
# Problem: Pod can't read secret
# Solution:
#   kubectl describe secret postgres-secret
#   kubectl get pods -o yaml | grep -A 5 secretKeyRef
#
# Problem: "Secret not found" error
# Solution:
#   kubectl get secrets --all-namespaces | grep postgres
#   Make sure secret is in same namespace as pod
#
# Problem: Wrong password in pod
# Solution:
#   kubectl get secret postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 --decode
#   Verify it matches your actual password
#
# Problem: Need to update secret
# Solution:
#   kubectl delete secret postgres-secret
#   kubectl create secret generic postgres-secret --from-literal=...
#   kubectl rollout restart deployment/gateway
#
# ============================================================
