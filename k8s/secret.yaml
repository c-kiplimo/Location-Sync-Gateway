# WARNING: This is a template. DO NOT commit actual secrets to Git.
# Use Sealed Secrets, Vault, or AWS Secrets Manager in production.

apiVersion: v1
kind: Secret
metadata:
  name: location-sync-gateway-secrets
  namespace: location-sync-gateway
  labels:
    app: location-sync-gateway
type: Opaque
stringData:
  # Database credentials
  db-password: "REPLACE_WITH_ACTUAL_PASSWORD"

  # Redis password
  redis-password: "REPLACE_WITH_ACTUAL_PASSWORD"

  # Google OAuth (optional for testing)
  google-oauth-client-id: "REPLACE_WITH_ACTUAL_CLIENT_ID"
  google-oauth-client-secret: "REPLACE_WITH_ACTUAL_CLIENT_SECRET"

  # Uberall API (optional for testing)
  uberall-private-key: "REPLACE_WITH_ACTUAL_PRIVATE_KEY"

  # OpenAI API (optional for AI features)
  openai-api-key: "REPLACE_WITH_ACTUAL_API_KEY"

  # Anthropic API (optional for AI features)
  anthropic-api-key: "REPLACE_WITH_ACTUAL_API_KEY"

  # Slack webhook (optional for notifications)
  slack-webhook-url: "REPLACE_WITH_ACTUAL_WEBHOOK_URL"

  # SMTP credentials (optional for email notifications)
  smtp-username: "REPLACE_WITH_ACTUAL_USERNAME"
  smtp-password: "REPLACE_WITH_ACTUAL_PASSWORD"

