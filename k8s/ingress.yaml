apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: location-sync-gateway-ingress
  namespace: location-sync-gateway
  labels:
    app: location-sync-gateway
  annotations:
    # Ingress controller type (AWS ALB)
    kubernetes.io/ingress.class: alb

    # ALB configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'

    # SSL/TLS configuration
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERTIFICATE_ID
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-2017-01
    alb.ingress.kubernetes.io/ssl-redirect: '443'

    # Health check configuration
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'

    # Performance and security
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30,stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400

    # WAF protection
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:ACCOUNT_ID:global/webacl/NAME/ID

    # Tags
    alb.ingress.kubernetes.io/tags: Environment=production,Team=platform,Project=location-sync-gateway

spec:
  ingressClassName: alb

  rules:
  - host: api.locationsync.example.com
    http:
      paths:
      # API endpoints
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: location-sync-gateway
            port:
              number: 80

      # Health check endpoint
      - path: /health
        pathType: Exact
        backend:
          service:
            name: location-sync-gateway
            port:
              number: 80

      # Metrics endpoint (should be protected in production)
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: location-sync-gateway
            port:
              number: 80

  - host: admin.locationsync.example.com
    http:
      paths:
      # Management/actuator endpoints
      - path: /management
        pathType: Prefix
        backend:
          service:
            name: location-sync-gateway
            port:
              number: 8081

  tls:
  - hosts:
    - api.locationsync.example.com
    - admin.locationsync.example.com
    secretName: location-sync-gateway-tls

---
# TLS Secret template (use cert-manager or AWS ACM in production)
apiVersion: v1
kind: Secret
metadata:
  name: location-sync-gateway-tls
  namespace: location-sync-gateway
  labels:
    app: location-sync-gateway
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # In production, use cert-manager with Let's Encrypt or AWS ACM
  tls.crt: LS0tLS1CRUdJTi... # Replace with actual certificate
  tls.key: LS0tLS1CRUdJTi... # Replace with actual private key

---
# Alternative: NGINX Ingress Controller configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: location-sync-gateway-ingress-nginx
  namespace: location-sync-gateway
  labels:
    app: location-sync-gateway
  annotations:
    kubernetes.io/ingress.class: nginx

    # SSL/TLS
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "20"

    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://dashboard.locationsync.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";

    # Connection settings
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - api.locationsync.example.com
    secretName: location-sync-gateway-tls-nginx

  rules:
  - host: api.locationsync.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: location-sync-gateway
            port:
              number: 80
