apiVersion: v1
kind: Service
metadata:
  name: location-sync-gateway
  namespace: location-sync-gateway
  labels:
    app: location-sync-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: management
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: location-sync-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: location-sync-gateway-headless
  namespace: location-sync-gateway
  labels:
    app: location-sync-gateway
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: location-sync-gateway
