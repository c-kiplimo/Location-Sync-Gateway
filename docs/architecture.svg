<svg width="1600" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Black Background -->
  <rect width="1600" height="700" fill="#000000"/>

  <!-- Title -->
  <text x="800" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">
    Location Sync Gateway
  </text>

  <!-- EXTERNAL SOURCES (Left) -->
  <g>
    <path d="M 50 90 L 268 92 L 270 390 L 48 388 L 50 90"
          fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="160" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">EXTERNAL</text>

    <!-- Google -->
    <path d="M 70 140 L 248 141 L 249 185 L 71 184 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="160" y="167" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Google</text>

    <!-- POS -->
    <path d="M 71 210 L 249 211 L 248 255 L 70 254 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="160" y="237" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">POS</text>

    <!-- ERP -->
    <path d="M 70 280 L 249 281 L 248 325 L 71 324 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="160" y="307" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">ERP</text>
  </g>

  <!-- GATEWAY (Center) -->
  <g>
    <!-- Main box -->
    <path d="M 310 90 L 1188 92 L 1190 600 L 308 598 L 310 90"
          fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="750" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">GATEWAY</text>

    <!-- Connectors -->
    <path d="M 330 145 L 485 146 L 486 205 L 331 204 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="408" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Connectors</text>

    <!-- Ingestion -->
    <path d="M 515 145 L 670 146 L 671 205 L 516 204 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="593" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Ingestion</text>

    <!-- Kafka -->
    <path d="M 700 145 L 855 146 L 856 205 L 701 204 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="778" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Kafka</text>

    <!-- Processing -->
    <path d="M 885 145 L 1160 146 L 1161 205 L 886 204 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="1023" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Processing</text>

    <!-- PostgreSQL (cylinder) -->
    <ellipse cx="470" cy="295" rx="90" ry="45"
             fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="470" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">PostgreSQL</text>

    <!-- Redis (cylinder) -->
    <ellipse cx="680" cy="295" rx="90" ry="45"
             fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="680" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Redis</text>

    <!-- AI/ML -->
    <path d="M 905 255 L 1140 256 L 1141 375 L 906 374 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="1023" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">AI/ML</text>
    <text x="1023" y="305" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">Quality Score</text>
    <text x="1023" y="325" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">Anomaly Detection</text>
    <text x="1023" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">ML Prediction</text>

    <!-- REST API -->
    <path d="M 420 435 L 820 436 L 821 525 L 421 524 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="620" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">REST API</text>
    <text x="620" y="495" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">/sync  /conflicts  /decisions</text>
  </g>

  <!-- OUTPUTS (Right) -->
  <g>
    <path d="M 1230 90 L 1548 92 L 1550 470 L 1228 468 L 1230 90"
          fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="1390" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">OUTPUTS</text>

    <!-- Dashboard -->
    <path d="M 1260 155 L 1518 156 L 1519 205 L 1261 204 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="1390" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Dashboard</text>

    <!-- Notifications -->
    <path d="M 1260 235 L 1518 236 L 1519 285 L 1261 284 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="1390" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Notifications</text>

    <!-- Clients -->
    <path d="M 1260 315 L 1518 316 L 1519 365 L 1261 364 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="1390" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Clients</text>
  </g>

  <!-- ARROWS -->

  <!-- External -> Connectors -->
  <path d="M 270 162 L 330 162" stroke="#FFFFFF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 270 232 L 300 232 L 330 180" stroke="#FFFFFF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 270 302 L 305 302 L 330 195" stroke="#FFFFFF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Connectors -> Ingestion -->
  <path d="M 486 175 L 515 175" stroke="#FFFFFF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Ingestion -> Kafka -->
  <path d="M 671 175 L 700 175" stroke="#FFFFFF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Kafka -> Processing -->
  <path d="M 856 175 L 885 175" stroke="#FFFFFF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Processing -> DBs -->
  <path d="M 990 205 Q 820 240 560 270" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
  <path d="M 1030 205 Q 900 250 745 270" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3,3" fill="none"/>

  <!-- Processing -> AI -->
  <path d="M 1023 205 L 1023 255" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2,2" fill="none"/>

  <!-- DBs -> API -->
  <path d="M 500 340 Q 520 385 520 435" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
  <path d="M 680 340 Q 680 385 680 435" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3,3" fill="none"/>

  <!-- API -> Outputs -->
  <path d="M 821 460 Q 1025 350 1260 180" stroke="#FFFFFF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 821 480 Q 1040 385 1260 260" stroke="#FFFFFF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 821 495 Q 1045 415 1260 340" stroke="#FFFFFF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="800" y="650" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">
    Kotlin • Micronaut • PostgreSQL • Kafka • Redis
  </text>

</svg>
